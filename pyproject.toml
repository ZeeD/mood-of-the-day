[build-system]
build-backend = "pdm.backend"
requires = [ "pdm-backend" ]

[project]
name = "mood-of-the-day"
version = "0.0.0"
readme = "README.md"
license = { file = "LICENSE", text = "AGPL-3.0-or-later" }
authors = [
    { name = "ZeeD", email = "vito.detullio@gmail.com" },
]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mastodon-py>=1.8.1",
    "python-dotenv>=1.0.1",
    "selenium>=4.22",
]
urls.Homepage = "https://github.com/ZeeD/mood-of-the-day"
urls.Repository = "https://github.com/ZeeD/mood-of-the-day.git"
gui-scripts.mood-of-the-day = "moodoftheday.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.5.4",
    "mypy>=1.10",
    "pyproject-fmt>2.5",
    "ruff>=0.4.10",
]

[tool.pdm]
distribution = false
scripts._.env = { PYTHONPATH = "src:tests" }
scripts.lint = { composite = [
    "pyproject-fmt pyproject.toml",
    "ruff format {args:.}",
    "ruff check {args:.}",
    "mypy {args:.}",
], keep_going = true }
scripts.test = { composite = [
    "coverage run -m unittest discover --verbose --locals --failfast --catch --start-directory {args:tests}",
    "coverage report",
    "coverage erase",
] }

[tool.ruff]
line-length = 80
src = [ "src", "stubs", "tests" ]
fix = true
format.quote-style = "single"
format.skip-magic-trailing-comma = true
format.docstring-code-format = true
lint.select = [ "ALL" ]
lint.ignore = [
    "ANN1",   # conflicts with formatter
    "COM812", # disabled by me
    "D1",     # incompatibilities
    "D203",   # D211
    "D213",   # D212
    "ISC001",
    "PT009",
    "Q001",
    "Q002"
]
lint.flake8-annotations.allow-star-arg-any = true
lint.flake8-quotes.docstring-quotes = "single"
lint.flake8-quotes.inline-quotes = "single"
lint.flake8-quotes.multiline-quotes = "single"
lint.flake8-type-checking.quote-annotations = true
lint.isort.force-single-line = true

[tool.pyproject-fmt]
column_width = 80
indent = 4

[tool.mypy]
mypy_path = [ "src", "tests", "stubs" ]
strict = true
warn_unused_configs = true

[tool.coverage]
run.branch = true
run.source = [ "src", "tests" ]
report.show_missing = true
report.skip_empty = true
report.sort = "Cover"
